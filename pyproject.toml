[project]
name = "google-hotels-mcp"
version = "0.1.2"
description = "MCP server for Google Hotels, Google Vacation Rentals and the Google Hotels daily price calendar. Returns live prices from Booking.com, Expedia, Agoda, Vrbo, Airbnb and other OTAs as JSON."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "huynhtanan" }]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "google-hotels",
    "google-vacation-rentals",
    "booking.com",
    "airbnb",
    "vrbo",
    "hotel-prices",
    "travel",
    "apify",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
google-hotels-mcp = "google_hotels_mcp.server:main"

[project.urls]
Homepage = "https://github.com/huynhtanan/google-hotels-mcp"
Issues = "https://github.com/huynhtanan/google-hotels-mcp/issues"
"Apify actor (hotels)" = "https://apify.com/zet46/google-hotels-scraper"
"Apify actor (price calendar)" = "https://apify.com/zet46/google-hotels-price-calendar"
"Apify actor (vacation rentals)" = "https://apify.com/zet46/google-vacation-rentals-scraper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_hotels_mcp"]
